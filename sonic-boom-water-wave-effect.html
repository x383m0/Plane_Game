<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sonic Boom Water Wave FX</title>
<style>
  :root{--bg-top:#0c1a24;--bg-bot:#3a5a63;--panel:#0e1c26dd;--border:#3aa0c9;--text:#dff3ff;--accent:#ffb020}
  html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));font-family:"Courier New",monospace;color:var(--text)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud,.hint,.controls,.direction{position:fixed;z-index:2}
  .hud{top:16px;left:16px;padding:10px 14px;border:1px solid var(--border);border-radius:4px;background:var(--panel);font-size:12px;letter-spacing:1px;line-height:1.55}
  .hud b{display:block;margin-bottom:5px;color:var(--accent);font-size:11px}
  .hint{top:16px;right:16px;max-width:250px;text-align:right;font-size:11px;letter-spacing:.5px;line-height:1.5;opacity:.76}
  .direction{top:94px;left:16px;padding:8px 11px;border-left:2px solid var(--accent);background:#0e1c2699;color:#ccecf6;font-size:11px;letter-spacing:1px}
  .direction strong{color:var(--accent);font-weight:normal}
  .controls{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  button{min-width:130px;padding:10px 15px;border:1px solid var(--border);border-radius:4px;background:#123444;color:var(--text);font:12px "Courier New",monospace;letter-spacing:1px;cursor:pointer}
  button:hover{background:#194c60}button:active{background:var(--border);color:#04141c}
  @media(max-width:560px){.hint{top:16px;left:16px;right:auto;text-align:left;margin-top:68px}.direction{top:146px}.controls{width:calc(100% - 32px)}button{flex:1;min-width:0}}
</style>
</head>
<body>
<div class="hud"><b>SONIC BOOM / WATER FX</b>Low pass over the water<br>Wave travels opposite the aircraft</div>
<div class="hint">Choose the plane's direction. The surge launches the other way.</div>
<div class="direction" id="direction">PLANE <strong>→</strong> &nbsp; / &nbsp; WATER WAVE <strong>←</strong></div>
<canvas id="c" aria-label="Plane sonic boom drives a large water wave in the opposite direction"></canvas>
<div class="controls">
  <button id="boomRight" type="button">SONIC BOOM →</button>
  <button id="boomLeft" type="button">SONIC BOOM ←</button>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const directionLabel=document.getElementById('direction');
let width=0,height=0,dpr=1,last=0,flight=null;
let waves=[],spray=[],mist=[],screenShake=0,flash=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function waterY(){return height*.665;}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  canvas.style.width=width+'px';canvas.style.height=height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize,{passive:true});resize();

class SonicWaterWave{
  constructor(x,baseY,dir,amplitude){
    this.center=x;this.baseY=baseY;this.dir=dir;this.amplitude=amplitude;
    this.age=0;this.speed=300;this.maxLife=2.8;this.dead=false;
  }
  update(dt){this.age+=dt;this.center+=this.dir*this.speed*dt;this.baseY=waterY();if(this.age>this.maxLife)this.dead=true;}
  heightAt(x){
    const ahead=(x-this.center)*this.dir;
    const front=32+this.age*12,back=66+this.age*14;
    const sigma=ahead>=0?front:back;
    const crest=this.amplitude*Math.exp(-.5*(ahead/sigma)**2);
    const trailingSwell=this.amplitude*.24*Math.exp(-.5*((ahead+back*1.45)/(back*.68))**2);
    const pulledTrough=-this.amplitude*.13*Math.exp(-.5*((ahead-front*1.35)/(front*.8))**2);
    const fade=1-.3*clamp((this.age-1.2)/1.6,0,1);
    return (crest+trailingSwell+pulledTrough)*fade;
  }
  surfaceY(x){return this.baseY-this.heightAt(x);}
  drawFoam(ctx){
    const fade=1-.36*clamp(this.age/this.maxLife,0,1);
    const back=66+this.age*14,front=32+this.age*12;
    ctx.save();ctx.globalAlpha=fade*.58;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<=36;i++){
      const ahead=-back*1.3+(i/36)*(back*1.3+front*1.15);
      const x=this.center+this.dir*ahead,y=this.surfaceY(x)-1.2;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    const foam=ctx.createLinearGradient(this.center-this.dir*back,this.baseY,this.center+this.dir*front,this.baseY);
    foam.addColorStop(0,'rgba(205,246,255,0)');foam.addColorStop(.42,'rgba(218,250,255,.86)');foam.addColorStop(1,'rgba(172,232,245,.12)');
    ctx.strokeStyle=foam;ctx.lineWidth=2.5;ctx.stroke();
    ctx.globalAlpha=fade*.5;ctx.strokeStyle='#d8f5fa';ctx.lineWidth=.9;
    for(let i=0;i<8;i++){
      const along=(i/7-.45)*back*1.25;
      const x=this.center-this.dir*along,y=this.surfaceY(x)-2;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-this.dir*rand(5,15),y-rand(1,3));ctx.stroke();
    }
    ctx.restore();
  }
}
function setDirection(dir){
  const plane=dir>0?'→':'←',wave=dir>0?'←':'→';
  directionLabel.innerHTML=`PLANE <strong>${plane}</strong> &nbsp; / &nbsp; WATER WAVE <strong>${wave}</strong>`;
}
function triggerBoom(dir=1){
  setDirection(dir);
  flight={x:dir>0?-75:width+75,y:waterY()-Math.max(58,height*.105),dir,speed:555,age:0,triggered:false};
}
function createWave(x,dir){
  const amplitude=Math.min(62,height*.13);
  waves.push(new SonicWaterWave(x,waterY(),dir,amplitude));
  for(let i=0;i<32;i++){
    const a=-Math.PI/2+rand(-.8,.8),speed=rand(55,210);
    spray.push({x,y:waterY()-rand(0,8),vx:Math.cos(a)*speed*.48+dir*rand(25,100),
      vy:Math.sin(a)*speed,r:rand(.9,2.8),life:0,maxLife:rand(.5,.95),dir});
  }
  for(let i=0;i<8;i++){
    mist.push({x:x+rand(-18,18),y:waterY()-rand(0,10),vx:dir*rand(5,32)+rand(-12,12),
      vy:-rand(8,34),r:rand(6,14),life:0,maxLife:rand(.4,.7)});
  }
  screenShake=.16;flash=.1;
}
document.getElementById('boomRight').addEventListener('click',()=>triggerBoom(1));
document.getElementById('boomLeft').addEventListener('click',()=>triggerBoom(-1));
addEventListener('keydown',e=>{if(e.code==='ArrowRight')triggerBoom(1);if(e.code==='ArrowLeft')triggerBoom(-1);});

function update(dt){
  if(flight){
    flight.age+=dt;flight.y=waterY()-Math.max(58,height*.105);flight.x+=flight.dir*flight.speed*dt;
    if(!flight.triggered&&((flight.dir>0&&flight.x>=width*.56)||(flight.dir<0&&flight.x<=width*.44))){
      createWave(flight.x,-flight.dir);flight.triggered=true;
    }
    if((flight.dir>0&&flight.x>width+110)||(flight.dir<0&&flight.x<-110))flight=null;
  }
  for(const w of waves)w.update(dt);waves=waves.filter(w=>!w.dead);
  for(const p of spray){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=410*dt;p.vx*=Math.exp(-dt*.36);}
  spray=spray.filter(p=>p.life<p.maxLife&&p.y<height+10);
  for(const p of mist){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*22;p.vx*=Math.exp(-dt*.8);}
  mist=mist.filter(p=>p.life<p.maxLife);
  screenShake=Math.max(0,screenShake-dt/.16);flash=Math.max(0,flash-dt/.1);
}
function surfaceAt(x){let y=waterY();for(const w of waves)y-=w.heightAt(x);return y;}
function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,height);
  sky.addColorStop(0,'#0c1a24');sky.addColorStop(.55,'#1b3540');sky.addColorStop(1,'#476d73');
  ctx.fillStyle=sky;ctx.fillRect(0,0,width,height);
  const glow=ctx.createLinearGradient(0,waterY()-90,0,waterY()+15);
  glow.addColorStop(0,'rgba(124,204,211,0)');glow.addColorStop(1,'rgba(109,194,205,.12)');
  ctx.fillStyle=glow;ctx.fillRect(0,waterY()-90,width,105);
  const water=ctx.createLinearGradient(0,waterY(),0,height);
  water.addColorStop(0,'#347d89');water.addColorStop(.38,'#1b596b');water.addColorStop(1,'#0b3447');
  ctx.beginPath();ctx.moveTo(0,height);ctx.lineTo(0,surfaceAt(0));
  for(let x=0;x<=width;x+=5)ctx.lineTo(x,surfaceAt(x));
  ctx.lineTo(width,height);ctx.closePath();ctx.fillStyle=water;ctx.fill();
  ctx.save();ctx.globalAlpha=.16;ctx.strokeStyle='#b3e5e9';ctx.lineWidth=1;
  for(let i=0;i<7;i++){const y=waterY()+18+i*19;ctx.beginPath();ctx.moveTo(width*.06,y);ctx.lineTo(width*(.22+(i%3)*.12),y);ctx.stroke();}
  ctx.restore();
  ctx.beginPath();for(let x=0;x<=width;x+=5){const y=surfaceAt(x);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.strokeStyle=waves.length?'rgba(186,241,247,.62)':'rgba(145,211,220,.48)';ctx.lineWidth=waves.length?1.7:1.5;ctx.stroke();
  for(const w of waves)w.drawFoam(ctx);
}
function drawPlane(f){
  const tail=ctx.createLinearGradient(f.x-f.dir*145,f.y,f.x-f.dir*18,f.y);
  tail.addColorStop(0,'rgba(149,227,243,0)');tail.addColorStop(1,'rgba(185,244,255,.62)');
  ctx.save();ctx.strokeStyle=tail;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x-f.dir*145,f.y);ctx.lineTo(f.x-f.dir*18,f.y);ctx.stroke();
  const pulse=(f.age*4.2)%1,r=25+pulse*32;ctx.globalAlpha=(1-pulse)*.42;ctx.strokeStyle='#c8f5ff';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*.48,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha*=.55;
  ctx.beginPath();ctx.ellipse(f.x,f.y,r+9,(r+9)*.48,0,0,Math.PI*2);ctx.stroke();
  ctx.translate(f.x,f.y);ctx.scale(f.dir,1);ctx.globalAlpha=1;ctx.fillStyle='#e4f4f5';ctx.strokeStyle='#7fb9c5';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(5,-3.5);ctx.lineTo(-5,-13);ctx.lineTo(-9,-13);ctx.lineTo(-6,-3.5);
  ctx.lineTo(-20,-5);ctx.lineTo(-24,-3);ctx.lineTo(-24,3);ctx.lineTo(-6,3.5);ctx.lineTo(-9,11);ctx.lineTo(-5,11);
  ctx.lineTo(5,3.5);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function drawSpray(){
  for(const p of mist){
    const t=p.life/p.maxLife;ctx.save();ctx.globalAlpha=(1-t)*.34;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    g.addColorStop(0,'rgba(230,251,255,.88)');g.addColorStop(.55,'rgba(179,232,242,.44)');g.addColorStop(1,'rgba(152,220,235,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  for(const p of spray){
    const t=p.life/p.maxLife;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx));ctx.globalAlpha=1-t;
    ctx.fillStyle=t<.3?'#ecfcff':'#b9eaf3';ctx.beginPath();ctx.ellipse(0,0,Math.max(.7,p.r*(1-t*.4))*1.55,Math.max(.45,p.r*.62),0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}
function frame(now){
  const dt=last?Math.min((now-last)/1000,.04):0;last=now;update(dt);
  if(screenShake>0){const a=screenShake/.16*5;ctx.save();ctx.translate(rand(-a,a),rand(-a,a));}
  ctx.clearRect(0,0,width,height);drawBackground();drawSpray();
  if(flight)drawPlane(flight); // Keep the aircraft in front of the distant wave and spray.
  if(flash>0){ctx.save();ctx.globalAlpha=flash/.1*.16;ctx.fillStyle='#dffaff';ctx.fillRect(0,0,width,height);ctx.restore();}
  if(screenShake>0)ctx.restore();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);setTimeout(()=>triggerBoom(1),550);
</script>
</body>
</html>
